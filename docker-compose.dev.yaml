services:
  trading-backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: trade

    ports:
      - "5000:5000"

    env_file:
      - .env

    environment:
      NODE_ENV: development
      PORT: 5000

    volumes:
      - .:/app
      - /app/node_modules

    command: npm run start:dev